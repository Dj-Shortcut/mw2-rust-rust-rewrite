name: Content generators

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generators-${{ github.ref }}
  cancel-in-progress: true

# Regenerates the authored content from the committed generator scripts and
# compares the result byte for byte with the committed files. A match shows the
# committed files are exactly what the committed script produces with no
# inputs beyond its own code; it says nothing about who wrote the script.
jobs:
  audio:
    name: Regenerate the WAV pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate and compare
        run: |
          python scripts/generate_authored_audio.py --output "$RUNNER_TEMP/audio"
          diff -r --exclude=README.md assets/authored/audio "$RUNNER_TEMP/audio"
          echo "WAV pack and manifest match a fresh run of scripts/generate_authored_audio.py" >> "$GITHUB_STEP_SUMMARY"

  # Report-only until a run shows Blender's glTF export is byte-stable. The
  # .blend files embed save metadata and are not compared.
  models:
    name: Regenerate the models (report only)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      BLENDER: blender-4.3.2-linux-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: blender
        with:
          path: ${{ runner.temp }}/${{ env.BLENDER }}
          key: ${{ env.BLENDER }}
      - name: Download Blender
        if: steps.blender.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "https://download.blender.org/release/Blender4.3/$BLENDER.tar.xz" | tar -xJ -C "$RUNNER_TEMP"
      - name: Install Blender runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libsm6 libxkbcommon0
      - name: Generate
        run: |
          "$RUNNER_TEMP/$BLENDER/blender" -b --factory-startup \
            --python scripts/generate_authored_content.py -- --output "$RUNNER_TEMP/models"
      - name: Compare GLB files
        run: |
          status=0
          {
            echo "### Model regeneration"
            echo "| file | committed | regenerated |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for committed in assets/authored/*.glb; do
            name=$(basename "$committed")
            a=$(sha256sum "$committed" | cut -c1-12)
            b=$(sha256sum "$RUNNER_TEMP/models/$name" 2>/dev/null | cut -c1-12)
            echo "| $name | $a | ${b:-missing} |" >> "$GITHUB_STEP_SUMMARY"
            [ "$a" = "$b" ] || status=1
          done
          exit $status
